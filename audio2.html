<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音頻串流 · 一對一實時傳輸</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans TC', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #4c1d95, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 浮动粒子背景 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 60px rgba(139, 92, 246, 0.15);
            animation: cardFadeIn 0.8s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            text-align: center;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* EQ可视化区域 */
        .visualizer-container {
            position: relative;
            width: 100%;
            height: 180px;
            margin: 0 auto 32px;
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 6px;
            padding: 0 20px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .eq-bar {
            flex: 1;
            max-width: 12px;
            border-radius: 6px 6px 2px 2px;
            background: linear-gradient(to top, #8b5cf6, #3b82f6, #34d399);
            height: 8px;
            transition: height 0.08s ease-out;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
            position: relative;
        }

        .eq-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
            opacity: 0.6;
        }

        .visualizer-container.connected .eq-bar {
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
            background: linear-gradient(to top, #10b981, #34d399, #6ee7b7);
        }

        /* 状态提示 */
        .status {
            text-align: center;
            font-size: 16px;
            margin-bottom: 24px;
            padding: 12px 16px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .status.waiting {
            color: #93c5fd;
            background: rgba(59, 130, 246, 0.1);
            animation: breathe 2s ease-in-out infinite;
        }

        .status.connecting {
            color: #fcd34d;
            background: rgba(245, 158, 11, 0.1);
        }

        .status.connected {
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.1);
        }

        .status.error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* 按钮样式 */
        .btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(139, 92, 246, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(239, 68, 68, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }

        .btn:active::after {
            width: 300px;
            height: 300px;
        }

        /* 二维码区域 */
        .qrcode-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .qrcode-title {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 16px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            padding: 16px;
            background: #fff;
            border-radius: 16px;
            width: fit-content;
            margin: 0 auto 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .link-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            word-break: break-all;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .link-box:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
        }

        .copy-tip {
            text-align: center;
            color: #34d399;
            font-size: 12px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-tip.show {
            opacity: 1;
        }

        /* 提示框 */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .hidden {
            display: none !important;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
            }
            .title {
                font-size: 24px;
            }
            .visualizer-container {
                height: 140px;
                gap: 4px;
            }
            .eq-bar {
                max-width: 8px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- 浮动粒子背景 -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="card">
            <h1 class="title">🎙️ 實時音頻串流</h1>
            <p class="subtitle" id="subtitle">一對一低延遲 純音頻傳輸</p>

            <!-- EQ音频可视化 -->
            <div class="visualizer-container" id="visualizerContainer">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>

            <!-- 状态提示 -->
            <div class="status waiting" id="status">正在初始化連接...</div>

            <!-- 操作按钮区（发送端） -->
            <div id="senderControls" class="hidden">
                <button class="btn btn-primary" id="startBtn">
                    <i class="fa fa-play"></i> 開始傳輸音頻
                </button>
                <button class="btn btn-danger hidden" id="stopBtn">
                    <i class="fa fa-stop"></i> 停止傳輸
                </button>
            </div>

            <!-- 接收端二维码 -->
            <div id="receiverSection" class="qrcode-section hidden">
                <div class="qrcode-title">掃描二維碼 或 複製鏈接到手機打開</div>
                <div id="qrcode"></div>
                <div class="link-box" id="linkBox"></div>
                <div class="copy-tip" id="copyTip">✅ 鏈接已複製</div>
            </div>
        </div>
    </div>

    <!-- 提示框 -->
    <div class="toast" id="toast"></div>

    <audio id="audioPlayer" autoplay playsinline></audio>

    <script>
        // 生成浮动粒子
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 20 + 's';
            p.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        // 全局变量
        let peer = null;
        let localStream = null;
        let currentCall = null;
        let audioContext = null;
        let analyser = null;
        let animationId = null;
        const eqBars = document.querySelectorAll('.eq-bar');
        const visualizerContainer = document.getElementById('visualizerContainer');
        const BAR_COUNT = eqBars.length;

        // DOM元素
        const statusEl = document.getElementById('status');
        const senderControls = document.getElementById('senderControls');
        const receiverSection = document.getElementById('receiverSection');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const audioPlayer = document.getElementById('audioPlayer');
        const toastEl = document.getElementById('toast');

        // Toast提示
        function showToast(msg, duration = 2000) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        // 更新状态
        function setStatus(text, type) {
            statusEl.textContent = text;
            statusEl.className = `status ${type}`;
        }

        // 初始化EQ可视化
        function initVisualizer(stream) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (!analyser) analyser = audioContext.createAnalyser();
            analyser.fftSize = 128;
            analyser.smoothingTimeConstant = 0.8;
            
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const maxHeight = visualizerContainer.offsetHeight - 8;
            // 选取适合音频的频率段，跳过高低频无意义部分
            const startBin = 2;
            const endBin = Math.min(bufferLength - 2, BAR_COUNT + startBin);
            const step = Math.floor((endBin - startBin) / BAR_COUNT);
            
            function draw() {
                animationId = requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                
                for (let i = 0; i < BAR_COUNT; i++) {
                    const dataIndex = startBin + i * step;
                    const value = dataArray[dataIndex];
                    // 加一点动态范围压缩，低音量也有反应
                    const height = Math.max(8, Math.pow(value / 255, 0.85) * maxHeight);
                    eqBars[i].style.height = height + 'px';
                }
            }
            draw();
        }

        // 停止可视化
        function stopVisualizer() {
            if (animationId) cancelAnimationFrame(animationId);
            // 所有柱子回落到底部
            eqBars.forEach(bar => bar.style.height = '8px');
            visualizerContainer.classList.remove('connected');
        }

        // 生成随机ID
        function generateId() {
            return 'audio-' + Math.random().toString(36).substr(2, 9);
        }

        // 页面加载完成初始化
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const remoteId = urlParams.get('id');

            // PeerJS配置（多节点保障连接稳定）
            const peerConfig = {
                debug: 0,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun.qq.com:3478' }
                    ]
                }
            };

            if (remoteId) {
                // ============== 发送端（手机） ==============
                document.getElementById('subtitle').textContent = '點擊按鈕開始傳輸音頻';
                senderControls.classList.remove('hidden');
                receiverSection.classList.add('hidden');
                
                const peerId = generateId();
                peer = new Peer(peerId, peerConfig);

                peer.on('open', () => {
                    setStatus('✅ 就緒，點擊按鈕開始', 'waiting');
                    startBtn.disabled = false;
                });

                peer.on('error', (err) => {
                    console.error(err);
                    if (err.type === 'peer-unavailable') {
                        setStatus('❌ 接收端不在線，請刷新二維碼重試', 'error');
                    } else {
                        setStatus(`❌ 連接錯誤: ${err.type}`, 'error');
                    }
                    stopStream();
                });

                // 开始推流
                startBtn.addEventListener('click', async () => {
                    try {
                        setStatus('🎤 正在獲取麥克風權限...', 'connecting');
                        localStream = await navigator.mediaDevices.getUserMedia({
                            audio: {
                                echoCancellation: true,
                                noiseSuppression: true,
                                autoGainControl: true,
                                sampleRate: 48000,
                                channelCount: 2
                            },
                            video: false
                        });

                        setStatus('🔗 正在連接接收端...', 'connecting');
                        currentCall = peer.call(remoteId, localStream);
                        
                        currentCall.on('error', (err) => {
                            setStatus('❌ 連接失敗，請重試', 'error');
                            stopStream();
                        });

                        // 本地音频可视化
                        initVisualizer(localStream);
                        visualizerContainer.classList.add('connected');
                        
                        startBtn.classList.add('hidden');
                        stopBtn.classList.remove('hidden');
                        setStatus('🔊 音頻傳輸中...', 'connected');
                        showToast('傳輸已開始');

                    } catch (err) {
                        console.error(err);
                        if (err.name === 'NotAllowedError') {
                            setStatus('❌ 請允許麥克風權限', 'error');
                            showToast('請在瀏覽器設置中開啟麥克風權限');
                        } else {
                            setStatus(`❌ 獲取音頻失敗: ${err.message}`, 'error');
                        }
                    }
                });

                // 停止推流
                stopBtn.addEventListener('click', () => {
                    stopStream();
                    setStatus('⏹️ 傳輸已停止，點擊按鈕重新開始', 'waiting');
                    startBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    showToast('傳輸已停止');
                });

                function stopStream() {
                    if (currentCall) currentCall.close();
                    if (localStream) localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                    currentCall = null;
                    stopVisualizer();
                }

            } else {
                // ============== 接收端（电脑） ==============
                receiverSection.classList.remove('hidden');
                senderControls.classList.add('hidden');
                document.getElementById('subtitle').textContent = '等待手機連接';
                
                const peerId = generateId();
                peer = new Peer(peerId, peerConfig);

                peer.on('open', () => {
                    setStatus('📱 請用手機掃碼連接', 'waiting');
                    const inviteUrl = `${window.location.origin}${window.location.pathname}?id=${peerId}`;
                    
                    // 生成二维码
                    new QRCode(document.getElementById('qrcode'), {
                        text: inviteUrl,
                        width: 180,
                        height: 180,
                        colorDark: '#1e1b4b',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    // 显示链接
                    document.getElementById('linkBox').textContent = inviteUrl;
                    
                    // 点击复制链接
                    document.getElementById('linkBox').addEventListener('click', () => {
                        navigator.clipboard.writeText(inviteUrl).then(() => {
                            document.getElementById('copyTip').classList.add('show');
                            setTimeout(() => document.getElementById('copyTip').classList.remove('show'), 2000);
                        });
                    });

                    // 空闲状态小幅度跳动
                    idleAnimation();
                });

                peer.on('call', (call) => {
                    setStatus('📥 收到連接請求，正在接聽...', 'connecting');
                    call.answer(); // 只接收不发送
                    
                    call.on('stream', (remoteStream) => {
                        audioPlayer.srcObject = remoteStream;
                        audioPlayer.play().catch(err => {
                            // 处理自动播放限制
                            document.body.addEventListener('click', () => audioPlayer.play(), { once: true });
                            showToast('點擊任意位置開始播放聲音');
                        });
                        
                        // 远程音频可视化
                        if (animationId) cancelAnimationFrame(animationId);
                        initVisualizer(remoteStream);
                        visualizerContainer.classList.add('connected');
                        setStatus('🔊 已連接，正在播放音頻', 'connected');
                        showToast('連接成功！');
                    });

                    call.on('close', () => {
                        setStatus('📱 連接已斷開，等待重新連接', 'waiting');
                        audioPlayer.srcObject = null;
                        stopVisualizer();
                        idleAnimation();
                        showToast('連接已斷開');
                    });

                    call.on('error', (err) => {
                        setStatus('❌ 連接出錯，請重試', 'error');
                        console.error(err);
                    });
                });

                peer.on('error', (err) => {
                    console.error(err);
                    setStatus(`❌ 服務連接失敗，請刷新頁面重試`, 'error');
                });
            }

            // 空闲状态EQ柱缓慢跳动效果
            function idleAnimation() {
                if (animationId) cancelAnimationFrame(animationId);
                function idleDraw() {
                    animationId = requestAnimationFrame(idleDraw);
                    const time = Date.now() / 1000;
                    for (let i = 0; i < BAR_COUNT; i++) {
                        // 用正弦波生成自然的呼吸效果
                        const wave = Math.sin(time * 2 + i * 0.3) * 0.5 + 0.5;
                        const height = 8 + wave * 20;
                        eqBars[i].style.height = height + 'px';
                    }
                }
                idleDraw();
            }
            idleAnimation();

            // 页面关闭时清理资源
            window.addEventListener('beforeunload', () => {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                if (peer) peer.destroy();
            });
        });

        // 全局点击解锁音频播放（应对浏览器自动播放策略）
        document.body.addEventListener('click', () => {
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            if (audioPlayer.paused && audioPlayer.srcObject) {
                audioPlayer.play();
            }
        }, { once: true });
    </script>
</body>
</html>
